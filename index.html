<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адал Азамат: Цифровой Блокпост</title>
    <style>
        :root {
            --kz-blue: #00afca;
            --kz-gold: #fec130;
            --bg-dark: #f4f7f9;
            --panel-bg: #ffffff;
            --text-dark: #2c3e50;
            --success: #27ae60;
            --danger: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            background: var(--kz-blue);
            color: var(--kz-gold);
            padding: 25px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-bottom: 6px solid var(--kz-gold);
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; }

        .game-container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 25px;
            width: 98%;
            max-width: 1400px;
            height: calc(100vh - 180px);
            min-height: 650px;
        }

        .side-panel {
            background: var(--panel-bg);
            border: 3px solid var(--kz-blue);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
        }

        .side-panel h2 { font-size: 1.3rem; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #eee; width: 100%; padding-bottom: 10px; }
        #left-panel h2 { color: var(--success); }
        #right-panel h2 { color: var(--danger); }

        .center-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 25px;
            padding: 50px;
            box-shadow: 0 15px 40px rgba(0,175,202,0.15);
            border: 3px solid var(--kz-blue);
            text-align: center;
        }

        .question-card {
            background: #fdfdfe;
            padding: 40px;
            border-radius: 20px;
            /* КРУПНЫЙ ТЕКСТ В ЦЕНТРЕ */
            font-size: 2rem; 
            font-weight: 600;
            line-height: 1.4;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e0e6ed;
            color: var(--text-dark);
            transition: all 0.3s ease;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.02);
            width: 100%;
        }

        .buttons { display: flex; gap: 40px; width: 100%; justify-content: center; margin-top: 30px; }

        button {
            padding: 25px 60px;
            font-size: 1.5rem;
            font-weight: 800;
            cursor: pointer;
            border: none;
            border-radius: 60px;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            min-width: 250px;
        }

        .btn-true { background-color: var(--kz-blue); color: white; }
        .btn-false { background-color: var(--kz-gold); color: #443300; }
        
        button:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.2); }
        button:active { transform: translateY(0); }

        .mini-card {
            background: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 1rem;
            width: 95%;
            border-left: 5px solid var(--kz-blue);
            animation: fadeIn 0.4s ease forwards;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        #stats { margin-top: 20px; font-size: 1.4rem; font-weight: bold; color: var(--kz-blue); }

        .result-title { font-size: 3rem; margin-bottom: 20px; color: var(--kz-blue); }
    </style>
</head>
<body>

    <header>
        <h1>АДАЛ АЗАМАТ: ЦИФРОВОЙ БЛОКПОСТ 🇰🇿</h1>
    </header>

    <div class="game-container">
        <div class="side-panel" id="left-panel">
            <h2>ШЫНДЫҚ (ВЕРНО)</h2>
            <div id="correct-list" style="width: 100%;"></div>
        </div>

        <div class="center-panel" id="center-panel">
            <div id="game-zone" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
                <div class="question-card" id="question">Жүйе жүктелуде...</div>
                <div class="buttons">
                    <button class="btn-true" onclick="checkAnswer(true)">ПРАВДА</button>
                    <button class="btn-false" onclick="checkAnswer(false)">ЛОЖЬ</button>
                </div>
            </div>
            <div id="stats">Сұрақ: <span id="current">1</span> / <span id="total">10</span></div>
        </div>

        <div class="side-panel" id="right-panel">
            <h2>ӨТІРІК (ФЕЙК)</h2>
            <div id="false-list" style="width: 100%;"></div>
        </div>
    </div>

    <script>
        const questions = [
            { text: "«Введите данные карты для праздничной выплаты к 9 мая на сайте kz-pobeda.net»", ans: false },
            { text: "«Никому не говорите код из СМС, даже если звонящий представился сотрудником банка».", ans: true },
            { text: "«Полиция может позвонить и попросить перевести деньги на специальный счет для Вашей защиты».", ans: false },
            { text: "«Если друг в WhatsApp просит проголосовать за него — сначала позвоните ему лично».", ans: true },
            { text: "«Государственные органы никогда не запрашивают пароли от Ваших личных кабинетов по телефону».", ans: true },
            { text: "«Вы выиграли смартфон к 7 мая! Оплатите 2000 тг налога по ссылке в СМС».", ans: false },
            { text: "«Официальная регистрация в акции Бессмертный полк всегда бесплатная».", ans: true },
            { text: "«Если Вас пугают блокировкой счетов и требуют принять решение за минуту — это мошенники».", ans: true },
            { text: "«Банки никогда не отправляют курьеров домой, чтобы забрать Вашу банковскую карту».", ans: true },
            { text: "«К праздникам всем школьникам дарят 10 ГБ интернета, если отправить СМС на номер 777».", ans: false }
        ];

        let currentIndex = 0;
        let score = 0;

        const qElement = document.getElementById('question');
        const curElement = document.getElementById('current');
        const totalElement = document.getElementById('total');
        const leftList = document.getElementById('correct-list');
        const rightList = document.getElementById('false-list');

        totalElement.innerText = questions.length;

        function loadQuestion() {
            if (currentIndex < questions.length) {
                qElement.innerText = questions[currentIndex].text;
                curElement.innerText = currentIndex + 1;
            } else {
                showFinal();
            }
        }

        function checkAnswer(userAns) {
            const currentQ = questions[currentIndex];
            const isCorrect = userAns === currentQ.ans;
            
            const miniCard = document.createElement('div');
            miniCard.className = 'mini-card';
            miniCard.innerText = currentQ.text;

            if (currentQ.ans === true) {
                leftList.prepend(miniCard); // Добавляем наверх
                miniCard.style.borderLeftColor = 'var(--success)';
            } else {
                rightList.prepend(miniCard);
                miniCard.style.borderLeftColor = 'var(--danger)';
            }

            if (isCorrect) {
                score++;
                qElement.style.boxShadow = '0 0 30px rgba(39, 174, 96, 0.2)';
            } else {
                qElement.style.boxShadow = '0 0 30px rgba(231, 76, 60, 0.2)';
            }

            currentIndex++;
            setTimeout(() => {
                qElement.style.boxShadow = 'none';
                loadQuestion();
            }, 600);
        }

        function showFinal() {
            const resultZone = document.getElementById('game-zone');
            let message = score > 7 ? 
                "<div class='result-title'>🇰🇿 КЕРЕМЕТ!</div><p style='font-size:1.5rem'>Вы — Адал Азамат! Ваш цифровой тыл в безопасности.</p>" : 
                "<div class='result-title' style='color:var(--danger)'>МҰҚИЯТ БОЛЫҢЫЗ!</div><p style='font-size:1.5rem'>Блокпост прорван. Повторите правила безопасности.</p>";
            
            resultZone.innerHTML = `
                <div class="question-card" style="flex-direction:column">
                    ${message}
                    <div style="font-size: 2.5rem; margin: 30px 0; color:var(--kz-blue)">Результат: ${score} из ${questions.length}</div>
                    <button class="btn-true" onclick="location.reload()">НАЧАТЬ ЗАНОВО</button>
                </div>
            `;
            document.getElementById('stats').style.display = 'none';
        }

        loadQuestion();
    </script>
</body>
</html>
